<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#fff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZAGY Tech</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Russo+One&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/estilos.css">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>


<body class="bg-white">

    <!--  ======================================================= -->
    <!-- ✅ BARRA INFERIOR (móvil) -->
    <div class="fixed bottom-2 left-1/2 -translate-x-1/2 z-40 w-90">
        <div class="cardInicio2 h-15.5 w-full bg-white rounded-full absolute -top-0.5 left-0"></div>
        <div class="cardInicio h-15 w-full bg-stone-950 rounded-full relative flex items-center justify-center gap-x-6.5">
            <i class="ri-user-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textUsuario cursor-pointer">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Usuario</p>
            </i>
            <i class="ri-menu-search-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textCategorias cursor-pointer">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Categorías</p>
            </i>
            <i class="ri-home-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textInicio cursor-pointer opacity-0">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Inicio</p>
            </i>
            <i class="ri-poker-hearts-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textFavoritos cursor-pointer">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Favoritos</p>
            </i>
            <i class="ri-shopping-cart-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textCarrito cursor-pointer">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Carrito</p>
            </i>
        </div>
    </div>
    <!--  ======================================================= -->


    <!--  ======================================================= -->
    <!-- ESFERAS (móvil) -->
    <section>
        <div id="btnUsuario" class="fixed bottom-6.25 left-1/2 -translate-x-[calc(50%+120px)] z-50 size-12 rounded-4xl bg-temu flex items-center justify-center hidden">
            <i class="ri-user-line text-3xl text-white"></i>
        </div>
        <div id="btnCategorias" class="fixed bottom-6.25 left-1/2 -translate-x-[calc(50%+64.6px)] z-50 size-12 rounded-4xl bg-temu flex items-center justify-center hidden">
            <i class="ri-menu-search-line text-3xl text-white"></i>
        </div>
        <div id="btnInicio" class="fixed bottom-6.25 left-1/2 -translate-x-1/2 z-50 size-12 rounded-4xl bg-temu flex items-center justify-center">
            <i class="ri-home-line text-3xl text-white pb-0.5"></i>
        </div>
        <div id="btnFavoritos" class="fixed bottom-6.25 left-1/2 -translate-x-[calc(50%-64.6px)] z-50 size-12 rounded-4xl bg-temu flex items-center justify-center hidden">
            <i class="ri-poker-hearts-line text-3xl text-white"></i>
        </div>
        <div id="btnCarrito" class="fixed bottom-6.25 left-1/2 -translate-x-[calc(50%-120px)] z-50 size-12 rounded-4xl bg-temu flex items-center justify-center hidden">
            <i class="ri-shopping-cart-line text-3xl text-white"></i>
        </div>
    </section>
    <!--  ======================================================= -->


    <!--  ======================================================= -->
    <!-- == NAV DESKTOP ==-->
    <nav class="w-[95vw] h-10 mx-auto relative lg:max-w-7xl">
        <section class="size-9 absolute top-2 flex gap-8 xl:gap-12">
            <img src="assets/logoZagy.webp" alt="logo">

            <div class="flex gap-8 max-lg:hidden xl:gap-12">
                <button class="nav-desktop group flex flex-col justify-center items-center mt-1 cursor-pointer transition-all duration-300" data-nav="usuario">
                    <i class="ri-user-line text-xl text-stone-950 leading-none transition-colors duration-300 group-hover:text-temu"></i>
                    <p class="text-xs leading-none border-b-2 border-transparent transition-colors duration-300 group-hover:text-temu group-hover:border-temu">Usuario</p>
                </button>
                <button class="nav-desktop group flex flex-col justify-center items-center mt-1 cursor-pointer transition-all duration-300" data-nav="categorias">
                    <i class="ri-menu-search-line text-xl text-stone-950 leading-none transition-colors duration-300 group-hover:text-temu"></i>
                    <p class="text-xs leading-none border-b-2 border-transparent transition-colors duration-300 group-hover:text-temu group-hover:border-temu">Categorías</p>
                </button>
                <button class="nav-desktop group flex flex-col justify-center items-center mt-1 cursor-pointer transition-all duration-300" data-nav="inicio">
                    <i class="ri-home-line text-xl text-stone-950 leading-none transition-colors duration-300 group-hover:text-temu"></i>
                    <p class="text-xs leading-none border-b-2 border-transparent transition-colors duration-300 group-hover:text-temu group-hover:border-temu">Inicio</p>
                </button>
            </div>
        </section>

        <section class="bg-white border border-stone-950 rounded-4xl absolute right-0 top-2 h-9 w-[82dvw] sm:w-[88dvw] lg:w-170 lg:left-1/2 lg:-translate-x-[calc(50%-77px)] xl:w-187 xl:-translate-x-[calc(50%-92px)]">
            <input class="bg-none outline-none pl-4 pt-[4.5px] text-base w-[68dvw]
            sm:w-[81dvw]
            lg:w-[50dvw]
            xl:w-[48dvw]
            2xl:w-[36dvw]
            " type="text" placeholder="soporte para celular">

            <button class="h-7.5 w-11 rounded-3xl flex items-center justify-center absolute right-0.5 top-0.5 bg-stone-950 cursor-pointer">
                <i class="ri-search-line text-lg text-white"></i>
            </button>
        </section>

        <section class="w-30 h-9 absolute top-2 flex gap-8 right-0 xl:gap-12 xl:w-33">
            <div class="flex gap-8 max-lg:hidden xl:gap-12">
                <button class="nav-desktop group flex flex-col justify-center items-center mt-1 cursor-pointer transition-all duration-300" data-nav="favoritos">
                    <i class="ri-poker-hearts-line text-xl text-stone-950 leading-none transition-colors duration-300 group-hover:text-temu"></i>
                    <p class="text-xs leading-none border-b-2 border-transparent transition-colors duration-300 group-hover:text-temu group-hover:border-temu">Favoritos</p>
                </button>
                <button class="nav-desktop group flex flex-col justify-center items-center mt-1 cursor-pointer transition-all duration-300" data-nav="carrito">
                    <i class="ri-shopping-cart-line text-xl text-stone-950 leading-none transition-colors duration-300 group-hover:text-temu"></i>
                    <p class="text-xs leading-none border-b-2 border-transparent transition-colors duration-300 group-hover:text-temu group-hover:border-temu">Carrito</p>
                </button>
            </div>
        </section>
    </nav>
    <div class="w-full h-px bg-stone-950/10 mt-3 opacity-0"></div>
    <!--  ======================================================= -->


    <!--  ======================================================= -->
    <!-- == BOTONES CATEGORIAS == -->
    <!-- WRAPPER relativo que contiene TODO -->
    <nav class="w-[95vw] h-10 mx-auto relative lg:max-w-7xl">

        <!-- FLECHA IZQUIERDA (oculta por defecto, aparece al scrollear) -->
        <button id="scroll-left" class="hidden lg:hidden absolute left-0 top-1/2 -translate-y-1/2 z-10 w-6.5 h-6.5 bg-white/70 backdrop-blur-sm border border-stone-200 rounded-full items-center justify-center cursor-pointer shadow-sm hover:bg-white hover:shadow-md transition-all duration-200">
            <i class="ri-arrow-left-s-line text-lg text-stone-600"></i>
        </button>
        
        <!-- CONTENEDOR DE SCROLL (sin flechas dentro) -->
        <section id="categorias-scroll" class="flex items-center gap-2 overflow-x-auto scrollbar-hide snap-x snap-mandatory h-full px-1">
            
            <button class="cat-btn shrink-0 w-25 h-8 bg-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-white font-semibold text-sm">Todos</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-stone-950 font-semibold text-sm">Ofertas</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-stone-950 font-semibold text-sm">Hogar</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-stone-950 font-semibold text-sm">Tecnología</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-stone-950 font-semibold text-sm">Accesorios</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-stone-950 font-semibold text-sm">Figuras</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-stone-950 font-semibold text-sm">Álbums</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-stone-950 font-semibold text-sm">Ropa</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
            <p class="text-stone-950 font-semibold text-sm">Hombre</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
                <p class="text-stone-950 font-semibold text-sm">Mujer</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
                <p class="text-stone-950 font-semibold text-sm">Moda</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
                <p class="text-stone-950 font-semibold text-sm">Zapatillas</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
                <p class="text-stone-950 font-semibold text-sm">Relojes</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
                <p class="text-stone-950 font-semibold text-sm">Perfumes</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
                <p class="text-stone-950 font-semibold text-sm">Joyería</p>
            </button>
            <button class="cat-btn shrink-0 w-25 h-8 bg-white border border-stone-950 rounded-4xl flex justify-center items-center cursor-pointer snap-start">
                <p class="text-stone-950 font-semibold text-sm">Licores</p>
            </button>
            
        </section>

        <!-- FLECHA DERECHA (fuera del scroll, fija en el wrapper) -->
        <button id="scroll-right" class="hidden lg:flex absolute right-0 top-1/2 -translate-y-1/2 z-10 w-6.5 h-6.5 bg-white/70 backdrop-blur-sm border border-stone-200 rounded-full items-center justify-center cursor-pointer shadow-sm hover:bg-white hover:shadow-md transition-all duration-200">
            <i class="ri-arrow-right-s-line text-lg text-stone-600"></i>
        </button>
    </nav>
    <div class="w-full h-px bg-stone-950/10 hidden"></div>
    <!--  ======================================================= -->


    <!--  ======================================================= -->
    <!-- === HERO DESLIZANTE CON SWIPER === -->
<div class="w-[350px] mx-auto lg:max-w-7xl mt-2 pb-8 relative">  <!-- ← wrapper con padding-bottom -->
    
    <!-- Swiper (overflow hidden para cortar laterales) -->
    <div class="swiper hero-swiper relative overflow-hidden">
        
        <!-- Wrapper (track de Swiper) -->
        <div class="swiper-wrapper">
            
            <!-- SLIDE 1 -->
            <div class="swiper-slide relative w-full h-70">
                <div class="w-full h-full cardHero overflow-hidden">
                    <img src="assets/03.avif" class="w-full h-full object-cover object-[50%_20%] pointer-events-none" alt="">
                </div>
                <div class="btn-precio absolute w-25 h-10 bg-neutral-300 z-10 top-3 left-5 cardPrecioHero flex justify-center items-center cursor-pointer">
                    <p class="font-Russo text-[16px] iconoPrecio">s/ 951.87</p>
                </div>
                <button class="btn-carrito absolute w-15 h-10 bg-stone-950 z-10 bottom-3 right-5.5 flex justify-center items-center rounded-tl-3xl rounded-br-3xl cursor-pointer transition-transform duration-300">
                    <i class="ri-shopping-cart-line text-xl text-white"></i>
                </button>
                <div class="absolute w-45 h-12 bg-stone-950/50 z-10 bottom-3 left-3 flex justify-center items-start rounded-4xl flex-col gap-1">
                    <p class="text-white font-MontAlternates font-semibold pl-5 text-[14px] leading-none">Figura de Albedo</p>
                    <p class="text-white font-MontAlternates font-semibold pl-5 text-[14px] leading-none">15x20 cm</p>
                </div>
            </div>

            <!-- SLIDE 2 -->
            <div class="swiper-slide relative w-full h-70">
                <div class="w-full h-full cardHero overflow-hidden">
                    <img src="assets/05.jpg" class="w-full h-full object-cover object-[50%_20%] pointer-events-none" alt="">
                </div>
                <div class="btn-precio absolute w-25 h-10 bg-rose-200 z-10 top-3 left-5 cardPrecioHero flex justify-center items-center cursor-pointer">
                    <p class="font-Russo text-[16px] iconoPrecio">s/ 225.00</p>
                </div>
                <button class="btn-carrito absolute w-15 h-10 bg-stone-950 z-10 bottom-3 right-5.5 flex justify-center items-center rounded-tl-3xl rounded-br-3xl cursor-pointer transition-transform duration-300">
                    <i class="ri-shopping-cart-line text-xl text-white"></i>
                </button>
                <div class="absolute w-48 h-12 bg-stone-950/50 z-10 bottom-3 left-3 flex justify-center items-start rounded-4xl flex-col gap-1">
                    <p class="text-white font-MontAlternates font-semibold pl-5 text-[14px] leading-none">Figura de Zero Two</p>
                    <p class="text-white font-MontAlternates font-semibold pl-5 text-[14px] leading-none">35x50 cm</p>
                </div>
            </div>

            <!-- SLIDE 3 -->
            <div class="swiper-slide relative w-full h-70">
                <div class="w-full h-full cardHero overflow-hidden">
                    <img src="assets/04.avif" class="w-full h-full object-cover object-[50%_20%] pointer-events-none" alt="">
                </div>
                <div class="btn-precio absolute w-25 h-10 bg-capibara z-10 top-3 left-5 cardPrecioHero flex justify-center items-center cursor-pointer">
                    <p class="font-Russo text-[16px] iconoPrecio">s/ 115.00</p>
                </div>
                <button class="btn-carrito absolute w-15 h-10 bg-stone-950 z-10 bottom-3 right-5.5 flex justify-center items-center rounded-tl-3xl rounded-br-3xl cursor-pointer transition-transform duration-300">
                    <i class="ri-shopping-cart-line text-xl text-white"></i>
                </button>
                <div class="absolute w-47 h-12 bg-stone-950/50 z-10 bottom-3 left-3 flex justify-center items-start rounded-4xl flex-col gap-1">
                    <p class="text-white font-MontAlternates font-semibold pl-5 text-[14px] leading-none">Figura de Capibara</p>
                    <p class="text-white font-MontAlternates font-semibold pl-5 text-[14px] leading-none">30x25 cm</p>
                </div>
            </div>

        </div>

    </div>

    <!-- Dots FUERA del swiper, debajo -->
    <div class="swiper-pagination flex justify-center gap-2 mb-1"></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
