<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Chrome Android, Edge, Samsung Internet -->
    <meta name="theme-color" content="#fecaca">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/estilos.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body class="bg-red-200">

    <!-- ✅ BARRA - fuera del contenedor, posicionada sola -->
    <div class="fixed bottom-2 left-1/2 -translate-x-1/2 z-40 w-90">
        <!-- Borde blanco (sombra) -->
        <div class="cardInicio2 h-15.5 w-full bg-white rounded-full absolute -top-0.5 left-0"></div>
        <!-- Barra negra -->
        <div class="cardInicio h-15 w-full bg-stone-950 rounded-full relative flex items-center justify-center gap-x-6.5">
            <i class="ri-user-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textUsuario">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Usuario</p>
            </i>
            <i class="ri-menu-search-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textCategorias">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Categorías</p>
            </i>
            <i class="ri-home-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textInicio opacity-0">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Inicio</p>
            </i>
            <i class="ri-poker-hearts-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textFavoritos">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Favoritos</p>
            </i>
            <i class="ri-shopping-cart-line text-2xl text-white flex flex-col items-center gap-0 leading-none pb-1.25 textCarrito">
                <p class="text-[10px] leading-none mt-0.5 font-semibold">Carrito</p>
            </i>
            
        </div>
    </div>
    
    <!-- ✅ PELOTA - también fuera y encima de todo -->
    <div id="btnUsuario" class="fixed bottom-6.25 left-1/2 -translate-x-[calc(50%+120px)] z-50 size-12 rounded-4xl bg-amber-500 flex items-center justify-center hidden">
        <i class="ri-user-line text-3xl text-white"></i>
    </div>
    <div id="btnCategorias" class="fixed bottom-6.25 left-1/2 -translate-x-[calc(50%+64.6px)] z-50 size-12 rounded-4xl bg-amber-500 flex items-center justify-center hidden">
        <i class="ri-menu-search-line text-3xl text-white"></i>
    </div>
    <div id="btnInicio" class="fixed bottom-6.25 left-1/2 -translate-x-1/2 z-50 size-12 rounded-4xl bg-amber-500 flex items-center justify-center">
        <i class="ri-home-line text-3xl text-white pb-0.5"></i>
    </div>
    <div id="btnFavoritos" class="fixed bottom-6.25 left-1/2 -translate-x-[calc(50%-64.6px)] z-50 size-12 rounded-4xl bg-amber-500 flex items-center justify-center hidden">
        <i class="ri-poker-hearts-line text-3xl text-white"></i>
    </div>
    <div id="btnCarrito" class="fixed bottom-6.25 left-1/2 -translate-x-[calc(50%-120px)] z-50 size-12 rounded-4xl bg-amber-500 flex items-center justify-center hidden">
        <i class="ri-shopping-cart-line text-3xl text-white"></i>
    </div>
    

    <!-- CONTENIDO (sin flex, con padding-bottom para no tapar con la barra) -->
    <div class="container mb-5 min-h-dvh w-[90vw] mx-auto pb-24">
        <h1 class="text-4xl font-bold">Hola mundo</h1>
        <img src="assets/03.avif" alt="">
        <img src="assets/04.avif" alt="">
        <img src="assets/05.jpg" alt="">
        <img src="assets/06.jpg" alt="">
        <img src="assets/07.avif" alt="">
        <img src="assets/08.avif" alt="">
    </div>


<script src="js/app.js"></script>
</body>
</html>
